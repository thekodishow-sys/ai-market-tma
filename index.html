<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Market - Premium Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:active {
            transform: scale(0.97);
        }
        /* Светлая тема - доработки */
        .light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        .light-mode .card-bg {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .light-mode .header-bg {
            background: rgba(248, 250, 252, 0.8);
            border-bottom: 1px solid #e2e8f0;
        }
        /* Темная тема */
        .dark-mode {
            background-color: #050505;
            color: #ffffff;
        }
        .dark-mode .card-bg {
            background: rgba(17, 17, 17, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .dark-mode .header-bg {
            background: rgba(5, 5, 5, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Скрытие полосы прокрутки */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="dark-mode" id="body">

    <div id="app">
        <!-- Background Glow (Dark Mode only) -->
        <div id="glow-bg" class="fixed inset-0 overflow-hidden pointer-events-none opacity-50">
            <div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-blue-600/10 blur-[120px] rounded-full"></div>
        </div>

        <!-- Header -->
        <header class="sticky top-0 z-40 header-bg glass px-6 pt-8 pb-4 transition-all">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-black tracking-tight italic">AI <span class="text-blue-600 not-italic">MARKET</span></h1>
                    <p class="text-[10px] uppercase tracking-[0.2em] font-extrabold opacity-50">Premium Goods</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="toggleTheme()" class="w-10 h-10 flex items-center justify-center rounded-full border border-current opacity-20 hover:opacity-100 transition">
                        <i id="theme-icon" data-lucide="sun" class="w-5 h-5"></i>
                    </button>
                    <button onclick="toggleAdmin()" id="admin-toggle" class="w-10 h-10 flex items-center justify-center rounded-full border border-current opacity-20 transition">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="relative group">
                <div class="absolute inset-0 bg-blue-500/10 blur-xl opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center bg-current/5 border border-current/10 rounded-2xl p-1 px-4">
                    <i data-lucide="search" class="w-4 h-4 opacity-40"></i>
                    <input 
                        type="text" 
                        placeholder="Поиск инструмента..." 
                        oninput="handleSearch(this.value)"
                        class="w-full bg-transparent py-3 px-3 text-sm focus:outline-none placeholder:opacity-30"
                    />
                </div>
            </div>

            <button id="add-btn" onclick="openCreateModal()" class="hidden w-full mt-4 py-3 border-2 border-dashed border-blue-500/50 rounded-2xl text-blue-500 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Добавить товар
            </button>
        </header>

        <!-- Catalog -->
        <main class="relative z-10 px-6 pt-6 pb-24 space-y-4" id="catalog">
            <!-- Products will be injected here -->
        </main>

        <!-- Product Modal -->
        <div id="product-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closeProductModal()"></div>
            <div id="modal-content" class="relative w-full max-w-sm rounded-[40px] overflow-hidden card-bg shadow-2xl transition-all scale-95 opacity-0">
                <div id="modal-header-color" class="h-28 flex items-center justify-center relative">
                    <h2 class="text-4xl font-black text-white/20 italic tracking-tighter uppercase select-none" id="modal-bg-title"></h2>
                    <button onclick="closeProductModal()" class="absolute top-6 right-6 bg-black/20 p-2 rounded-full text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-8">
                    <h3 class="text-2xl font-black mb-1" id="modal-title"></h3>
                    <p class="text-sm opacity-50 mb-8 leading-relaxed" id="modal-desc"></p>
                    
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <span class="text-[10px] font-black uppercase opacity-40 tracking-widest block mb-1">Стоимость доступа</span>
                            <span class="text-3xl font-black italic" id="modal-price"></span>
                        </div>
                        <div class="text-right">
                            <div class="flex items-center gap-1 text-green-500 font-bold text-[10px] uppercase">
                                <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div> online
                            </div>
                        </div>
                    </div>
                    
                    <button onclick="handleBuy()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-sm shadow-xl shadow-blue-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                        ОФОРМИТЬ ДОСТУП <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Admin Modal -->
        <div id="admin-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4">
            <div class="absolute inset-0 bg-black/95 backdrop-blur-xl" onclick="closeAdminModal()"></div>
            <div class="relative w-full max-w-md card-bg rounded-[32px] p-8 space-y-4">
                <h2 id="admin-modal-title" class="text-xl font-black mb-4">Настройка товара</h2>
                <div class="space-y-4">
                    <input id="edit-name" placeholder="Название" class="w-full bg-current/5 border border-current/10 p-4 rounded-2xl focus:border-blue-500 outline-none">
                    <textarea id="edit-desc" placeholder="Описание" class="w-full bg-current/5 border border-current/10 p-4 rounded-2xl focus:border-blue-500 outline-none h-24"></textarea>
                    <div class="grid grid-cols-2 gap-4">
                        <input id="edit-price" type="number" placeholder="Цена (₽)" class="w-full bg-current/5 border border-current/10 p-4 rounded-2xl focus:border-blue-500 outline-none">
                        <input id="edit-type" placeholder="Тип доступа" class="w-full bg-current/5 border border-current/10 p-4 rounded-2xl focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button id="delete-btn" onclick="deleteProduct()" class="flex-1 py-4 bg-red-600/10 text-red-600 rounded-2xl font-bold text-sm">УДАЛИТЬ</button>
                    <button onclick="saveProduct()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        let products = [
            { id: 1, name: "ChatGPT Plus", type: "Personal Account", description: "Полный доступ к GPT-4o, DALL-E 3 и продвинутому анализу данных без ограничений.", price: 2490, color: "from-[#10a37f] to-[#056148]" },
            { id: 2, name: "Midjourney Pro", type: "Artist Access", description: "Создавайте шедевры с максимальной скоростью в режиме Fast Hours и коммерческими правами.", price: 3200, color: "from-[#5e5ce6] to-[#3b3a99]" },
            { id: 3, name: "Claude 3.5 Sonnet", type: "API & Web", description: "Интеллектуальный лидер в написании кода и анализе сложных текстов.", price: 2100, color: "from-[#d97757] to-[#a34f36]" }
        ];
        let isAdmin = false;
        let isDark = true;
        let currentEditingId = null;

        // --- Init ---
        function init() {
            renderCatalog();
            lucide.createIcons();
        }

        // --- Catalog Logic ---
        function renderCatalog(filter = "") {
            const container = document.getElementById('catalog');
            const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
            
            container.innerHTML = filtered.map(p => `
                <div class="relative group">
                    <div onclick="openProductModal(${p.id})" class="product-card card-bg rounded-[24px] p-5 cursor-pointer overflow-hidden relative">
                        <div class="absolute -right-10 -top-10 w-32 h-32 bg-gradient-to-br ${p.color} opacity-10 blur-3xl group-hover:opacity-20 transition-opacity"></div>
                        <div class="flex items-center gap-4 relative z-10">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${p.color} flex items-center justify-center text-white font-black text-xl shadow-lg">
                                ${p.name[0]}
                            </div>
                            <div class="flex-grow">
                                <h3 class="font-bold text-base flex items-center gap-2">${p.name}</h3>
                                <p class="text-[10px] font-bold uppercase tracking-widest opacity-40">${p.type}</p>
                            </div>
                            <div class="text-right flex items-center gap-3">
                                <div class="text-lg font-black tracking-tighter">${p.price.toLocaleString()} ₽</div>
                                <i data-lucide="chevron-right" class="w-5 h-5 opacity-20"></i>
                            </div>
                        </div>
                    </div>
                    ${isAdmin ? `<button onclick="openEditModal(${p.id}, event)" class="absolute -top-2 -right-2 bg-blue-600 text-white p-2 rounded-full shadow-xl z-20"><i data-lucide="edit-3" class="w-4 h-4"></i></button>` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        function handleSearch(val) { renderCatalog(val); }

        // --- UI Interactions ---
        function toggleTheme() {
            isDark = !isDark;
            const body = document.getElementById('body');
            const icon = document.getElementById('theme-icon');
            const glow = document.getElementById('glow-bg');
            
            if (isDark) {
                body.className = "dark-mode";
                icon.setAttribute('data-lucide', 'sun');
                glow.style.display = 'block';
            } else {
                body.className = "light-mode";
                icon.setAttribute('data-lucide', 'moon');
                glow.style.display = 'none';
            }
            lucide.createIcons();
        }

        function toggleAdmin() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-toggle');
            const addBtn = document.getElementById('add-btn');
            btn.classList.toggle('bg-blue-600', isAdmin);
            btn.classList.toggle('text-white', isAdmin);
            btn.classList.toggle('opacity-20', !isAdmin);
            addBtn.classList.toggle('hidden', !isAdmin);
            renderCatalog();
        }

        // --- Modals ---
        function openProductModal(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('modal-title').innerText = p.name;
            document.getElementById('modal-bg-title').innerText = p.name;
            document.getElementById('modal-desc').innerText = p.description;
            document.getElementById('modal-price').innerText = p.price.toLocaleString() + " ₽";
            document.getElementById('modal-header-color').className = `h-28 flex items-center justify-center relative bg-gradient-to-br ${p.color}`;
            
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeProductModal() {
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        // --- Admin Logic ---
        function openEditModal(id, e) {
            if(e) e.stopPropagation();
            currentEditingId = id;
            const p = products.find(x => x.id === id);
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-desc').value = p.description;
            document.getElementById('edit-price').value = p.price;
            document.getElementById('edit-type').value = p.type;
            document.getElementById('admin-modal-title').innerText = "Редактировать товар";
            document.getElementById('delete-btn').classList.remove('hidden');
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function openCreateModal() {
            currentEditingId = null;
            document.getElementById('edit-name').value = "";
            document.getElementById('edit-desc').value = "";
            document.getElementById('edit-price').value = "";
            document.getElementById('edit-type').value = "";
            document.getElementById('admin-modal-title').innerText = "Новый товар";
            document.getElementById('delete-btn').classList.add('hidden');
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function saveProduct() {
            const name = document.getElementById('edit-name').value;
            const desc = document.getElementById('edit-desc').value;
            const price = parseInt(document.getElementById('edit-price').value);
            const type = document.getElementById('edit-type').value;

            if (currentEditingId) {
                products = products.map(p => p.id === currentEditingId ? {...p, name, description: desc, price, type} : p);
            } else {
                products.push({
                    id: Date.now(),
                    name,
                    description: desc,
                    price,
                    type,
                    color: "from-blue-600 to-indigo-800"
                });
            }
            renderCatalog();
            closeAdminModal();
        }

        function deleteProduct() {
            if(confirm("Удалить этот товар?")) {
                products = products.filter(p => p.id !== currentEditingId);
                renderCatalog();
                closeAdminModal();
            }
        }

        function handleBuy() {
            alert("Переход к оплате. В реальном приложении здесь будет ссылка на платежный шлюз.");
        }

        window.onload = init;
    </script>
</body>
</html>
