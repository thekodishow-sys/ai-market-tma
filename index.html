<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Market Premium</title>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: rgba(255, 255, 255, 0.06);
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --secondary-text: rgba(255, 255, 255, 0.5);
        }

        .light-mode {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --secondary-text: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        .glass-header {
            background: rgba(var(--bg-color), 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            transform: translateY(100px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        input, textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--text-color) !important;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="dark-mode" id="main-body">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-6 pt-8 pb-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-extrabold uppercase tracking-[0.2em] opacity-50">Premium AI Store</span>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">Маркетплейс</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleTheme()" class="w-11 h-11 flex items-center justify-center rounded-2xl bg-white/5 border border-white/10 active:scale-90 transition-transform">
                    <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
                </button>
                <button id="admin-toggle-btn" onclick="toggleAdmin()" class="hidden w-11 h-11 items-center justify-center rounded-2xl bg-white/5 border border-white/10 active:scale-90 transition-transform">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="relative group">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 opacity-40 group-focus-within:text-blue-500 transition-colors"></i>
            <input type="text" placeholder="Поиск инструментов..." oninput="handleSearch(this.value)" class="w-full bg-white/5 border-none rounded-2xl py-4 pl-12 pr-4 text-sm font-medium outline-none transition-all">
        </div>

        <button id="add-btn" onclick="openCreateModal()" class="hidden w-full mt-4 py-4 bg-blue-600/10 border border-blue-500/30 rounded-2xl text-blue-500 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-transform">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> Добавить новый AI
        </button>
    </header>

    <!-- Content -->
    <main id="catalog" class="px-6 py-6 pb-24 space-y-4">
        <!-- Skeleton Loaders -->
        <div class="product-card p-5 flex items-center gap-4 shimmer h-24"></div>
        <div class="product-card p-5 flex items-center gap-4 shimmer h-24"></div>
        <div class="product-card p-5 flex items-center gap-4 shimmer h-24"></div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal-overlay fixed inset-0 z-50 p-6 items-end sm:items-center justify-center">
        <div class="absolute inset-0" onclick="closeModals()"></div>
        <div class="modal-content relative w-full max-w-md bg-[#121212] light:bg-white rounded-[32px] overflow-hidden shadow-2xl border border-white/10">
            <div id="m-gradient" class="h-32 bg-gradient-to-r from-blue-600 to-indigo-600 relative p-6 flex justify-end">
                <button onclick="closeModals()" class="w-10 h-10 bg-black/20 backdrop-blur-md rounded-full flex items-center justify-center text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-8 -mt-10">
                <div class="w-20 h-20 rounded-[24px] bg-white shadow-xl mb-6 flex items-center justify-center text-3xl font-black text-blue-600" id="m-icon">A</div>
                <h3 id="m-title" class="text-3xl font-extrabold mb-2"></h3>
                <div class="inline-block px-3 py-1 rounded-full bg-blue-500/10 text-blue-500 text-[10px] font-bold uppercase tracking-widest mb-6" id="m-type"></div>
                <p id="m-desc" class="text-base opacity-60 mb-8 leading-relaxed"></p>
                
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <p class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">Стоимость доступа</p>
                        <p id="m-price" class="text-3xl font-black"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">Рейтинг</p>
                        <div class="flex text-yellow-500"><i data-lucide="star" class="w-4 h-4 fill-current"></i><i data-lucide="star" class="w-4 h-4 fill-current"></i><i data-lucide="star" class="w-4 h-4 fill-current"></i><i data-lucide="star" class="w-4 h-4 fill-current"></i><i data-lucide="star" class="w-4 h-4 fill-current"></i></div>
                    </div>
                </div>

                <button onclick="handleBuy()" class="btn-primary w-full py-5 text-white rounded-2xl font-extrabold text-lg active:scale-95 transition-transform">ОФОРМИТЬ ПОДПИСКУ</button>
            </div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="modal-overlay fixed inset-0 z-50 p-6 items-center justify-center">
        <div class="absolute inset-0" onclick="closeModals()"></div>
        <div class="modal-content relative w-full max-w-md bg-[#121212] rounded-[32px] p-8 border border-white/10 space-y-5">
            <div class="flex justify-between items-center mb-2">
                <h2 id="adm-title" class="text-2xl font-bold">Настройка</h2>
                <button onclick="closeModals()" class="opacity-40"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase opacity-40 ml-2">Название сервиса</label>
                    <input id="e-name" class="w-full p-4 rounded-2xl outline-none text-sm font-medium">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold uppercase opacity-40 ml-2">Описание функций</label>
                    <textarea id="e-desc" class="w-full p-4 rounded-2xl outline-none text-sm font-medium h-24 resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase opacity-40 ml-2">Цена (₽)</label>
                        <input id="e-price" type="number" class="w-full p-4 rounded-2xl outline-none text-sm font-medium">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold uppercase opacity-40 ml-2">Категория</label>
                        <input id="e-type" placeholder="Напр. Текст" class="w-full p-4 rounded-2xl outline-none text-sm font-medium">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-4">
                <button id="del-btn" onclick="deleteProduct()" class="flex-1 py-4 bg-red-500/10 text-red-500 rounded-2xl font-bold text-sm hover:bg-red-500/20 transition-colors">УДАЛИТЬ</button>
                <button id="save-btn" onclick="saveProduct()" class="flex-[2] py-4 btn-primary text-white rounded-2xl font-bold text-sm active:scale-95 transition-transform">СОХРАНИТЬ</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.backgroundColor = "#000000";
        tg.headerColor = "#000000";

        const ADMIN_ID = 5017229451; 
        const SUPABASE_URL = 'https://cilnfljllyubwhooxuuo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpbG5mbGpseXVid2hvb3h1dW9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMjMyNDIsImV4cCI6MjA4NjY5OTI0Mn0.030FmUuyL6Ht-C4WlEvA0jL29rvx_m1JH8rQ1V8W6oQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let isAdminMode = false;
        let isDark = true;
        let currentId = null;

        async function init() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                if (user.id === ADMIN_ID) {
                    document.getElementById('admin-toggle-btn').classList.remove('hidden');
                    document.getElementById('admin-toggle-btn').classList.add('flex');
                }
            }
            await fetchProducts();
            lucide.createIcons();
        }

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
                if (error) throw error;
                products = data || [];
                renderCatalog();
            } catch (err) {
                console.error(err);
                document.getElementById('catalog').innerHTML = `<div class='text-center py-20 opacity-40 font-medium'>Не удалось загрузить данные</div>`;
            }
        }

        function renderCatalog(filter = "") {
            const container = document.getElementById('catalog');
            const filtered = products.filter(p => (p.name || "").toLowerCase().includes(filter.toLowerCase()));
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class='text-center py-20 opacity-30 text-sm font-bold uppercase tracking-widest'>Инструменты не найдены</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => `
                <div class="relative group">
                    <div class="product-card p-5 flex items-center gap-5 cursor-pointer" onclick="openProduct(${p.id})">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-blue-500/20">
                            ${p.name ? p.name[0] : '?'}
                        </div>
                        <div class="flex-grow">
                            <h3 class="font-bold text-base mb-0.5">${p.name}</h3>
                            <div class="flex items-center gap-2">
                                <span class="text-[9px] font-extrabold uppercase tracking-widest opacity-40 px-2 py-0.5 rounded-full bg-white/5">${p.type || 'AI TOOL'}</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-lg font-extrabold italic">${p.price.toLocaleString()} ₽</div>
                        </div>
                    </div>
                    ${isAdminMode ? `
                        <button onclick="openEdit(${p.id}, event)" class="absolute -top-2 -right-2 bg-blue-600 text-white w-8 h-8 rounded-full shadow-xl flex items-center justify-center z-10 hover:scale-110 transition-transform">
                            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                        </button>
                    ` : ''}
                </div>
            `).join('');
            lucide.createIcons();
        }

        function handleSearch(v) { renderCatalog(v); }

        function toggleTheme() {
            isDark = !isDark;
            const body = document.getElementById('main-body');
            body.classList.toggle('light-mode', !isDark);
            body.classList.toggle('dark-mode', isDark);
            document.getElementById('theme-icon').setAttribute('data-lucide', isDark ? "moon" : "sun");
            tg.backgroundColor = isDark ? "#000000" : "#f4f7fa";
            tg.headerColor = isDark ? "#000000" : "#f4f7fa";
            lucide.createIcons();
        }

        function toggleAdmin() {
            isAdminMode = !isAdminMode;
            const btn = document.getElementById('admin-toggle-btn');
            btn.classList.toggle('opacity-30', !isAdminMode);
            btn.classList.toggle('bg-blue-600', isAdminMode);
            btn.classList.toggle('text-white', isAdminMode);
            document.getElementById('add-btn').classList.toggle('hidden', !isAdminMode);
            renderCatalog();
        }

        function openProduct(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('m-title').innerText = p.name;
            document.getElementById('m-desc').innerText = p.description;
            document.getElementById('m-price').innerText = p.price.toLocaleString() + ' ₽';
            document.getElementById('m-type').innerText = p.type || 'AI TOOL';
            document.getElementById('m-icon').innerText = p.name ? p.name[0] : 'A';
            document.getElementById('product-modal').classList.add('active');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function openEdit(id, e) {
            e.stopPropagation();
            currentId = id;
            const p = products.find(x => x.id === id);
            document.getElementById('e-name').value = p.name;
            document.getElementById('e-desc').value = p.description;
            document.getElementById('e-price').value = p.price;
            document.getElementById('e-type').value = p.type;
            document.getElementById('adm-title').innerText = "Изменить";
            document.getElementById('del-btn').style.display = 'block';
            document.getElementById('admin-modal').classList.add('active');
            lucide.createIcons();
        }

        function openCreateModal() {
            currentId = null;
            document.querySelectorAll('#admin-modal input, #admin-modal textarea').forEach(i => i.value = "");
            document.getElementById('adm-title').innerText = "Новый продукт";
            document.getElementById('del-btn').style.display = 'none';
            document.getElementById('admin-modal').classList.add('active');
            lucide.createIcons();
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            document.body.style.overflow = '';
            tg.MainButton.hide();
        }

        async function saveProduct() {
            const data = {
                name: document.getElementById('e-name').value,
                description: document.getElementById('e-desc').value,
                price: parseInt(document.getElementById('e-price').value || 0),
                type: document.getElementById('e-type').value
            };
            
            if (!data.name || !data.price) {
                tg.showAlert("Заполните название и цену!");
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.innerHTML = '<span class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>';
            btn.disabled = true;

            try {
                if (currentId) {
                    await supabaseClient.from('products').update(data).eq('id', currentId);
                } else {
                    await supabaseClient.from('products').insert([data]);
                }
                await fetchProducts();
                closeModals();
            } catch (err) {
                tg.showAlert("Ошибка базы данных");
            } finally {
                btn.innerHTML = 'СОХРАНИТЬ';
                btn.disabled = false;
            }
        }

        async function deleteProduct() {
            tg.showConfirm("Удалить этот инструмент безвозвратно?", async (confirmed) => {
                if (confirmed) {
                    await supabaseClient.from('products').delete().eq('id', currentId);
                    await fetchProducts();
                    closeModals();
                }
            });
        }

        function handleBuy() {
            const price = document.getElementById('m-price').innerText;
            tg.MainButton.setParams({
                text: `ОПЛАТИТЬ ${price}`,
                color: '#2563eb',
                is_visible: true
            });
            tg.MainButton.onClick(() => {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert('Система оплаты находится в разработке.');
                tg.MainButton.hide();
            });
        }

        window.onload = init;
    </script>
</body>
</html>
